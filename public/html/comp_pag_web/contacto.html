    <div class="row g-3">
      {{#contactos}}
      <div class="col-md-6 col-lg-3"><div class="box-dash h-100"><i class="bi {{icono}} fs-2 hl"></i><h6 class="mt-2">{{titulo}}</h6><small>{{contenido}}</small></div></div>
