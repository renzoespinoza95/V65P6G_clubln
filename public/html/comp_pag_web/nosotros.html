<section id="nosotros" class="py-5">
  <div class="container"><div class="row g-4 align-items-center">
    <div class="col-lg-7">
      <p class="deco mb-1">Conoce {{nombre_negocio}}</p>
      {{#nosotros}}<h2 class="mb-3">{{titulo}} <span class="hl">{{subtitulo_detalle}}</span></h2><p>{{contenido}}</p>{{/nosotros}}
      <p class="mb-1"><i class="bi bi-telephone-fill hl"></i> <b>{{celular}}</b></p>
      <p><i class="bi bi-clock-fill hl"></i> <b>{{horario}}</b></p>
      <button class="btn-v" data-bs-toggle="modal" data-bs-target="#modalNosotros">Ver más</button>
    </div>
    <div class="col-lg-5"><div class="row g-3">
      {{#destacados}}
      <div class="col-6"><div class="card-dest"><img src="{{img}}" alt="{{name}}"><div class="card-dest-t"><span class="deco">{{name}}</span><b class="d-block">{{precio}}</b></div></div></div>
      {{/destacados}}
    </div></div>
  </div></div>
</section>
