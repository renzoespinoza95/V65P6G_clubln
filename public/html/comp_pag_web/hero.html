<section id="inicio" class="hero">
  <div class="hero-slides">
    {{#sliders}}
    <div class="hero-slide {{activo}}" data-idx="{{idx}}" style="background-image: url('{{img}}');">
      <div class="hero-overlay"></div>
      <div class="container position-relative z-2">
        <div class="row align-items-center">
          <div class="col-lg-8">
            <p class="deco mb-1">Bienvenido a {{nombre_negocio}}</p>
            <h1 class="display-4 mb-3">{{titulo_superior}}</h1>
            <p class="mb-4">{{descripcion}}</p>
            <button type="button" class="btn-v" data-bs-toggle="modal" data-bs-target="#modalReserva">Reservaciones</button>
          </div>
        </div>
      </div>
    </div>
    {{/sliders}}
  </div>
  <button id="hPrev" class="btn-v hero-nav hero-prev" aria-label="Anterior"><i class="bi bi-chevron-left"></i></button>
  <button id="hNext" class="btn-v dark hero-nav hero-next" aria-label="Siguiente"><i class="bi bi-chevron-right"></i></button>
</section>
