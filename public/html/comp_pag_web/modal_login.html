<div class="modal fade" id="modalLogin" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="modalLoginT" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered"><div class="modal-content">
    <div class="modal-body p-4 text-center">
      <img src="{{logo}}" alt="{{nombre_negocio}}" width="84" height="84" class="rounded-circle mb-2">
      <h5 class="f-title mb-0" id="modalLoginT">{{nombre_negocio}}</h5>
      <p class="deco mb-3">Acceso a reservaciones</p>
      <form id="formLogin" class="text-start" novalidate>
        <label class="form-label" for="lgUsuario">Usuario</label>
        <input type="text" class="form-control mb-3" id="lgUsuario" name="usuario" autocomplete="username" required>
        <label class="form-label" for="lgClave">Contraseña</label>
        <input type="password" class="form-control" id="lgClave" name="clave" autocomplete="current-password" required>
        <div id="loginError" class="alert alert-danger py-2 small mt-3 mb-0 d-none" role="alert"></div>
        <button type="submit" class="btn-v w-100 mt-3" id="btnLogin">
          <span class="spinner-border spinner-border-sm d-none me-1" aria-hidden="true"></span>Ingresar
        </button>
      </form>
    </div>
  </div></div>
</div>
