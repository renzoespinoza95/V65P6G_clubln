<div class="topbar d-none d-md-block py-2">
  <div class="container d-flex justify-content-between">
    <span><i class="bi bi-geo-alt hl"></i> {{direccion}}</span>
    <span><i class="bi bi-telephone hl"></i> {{celular}}</span>
    <div class="dropdown">
      <a class="text-reset text-decoration-none dropdown-toggle" data-bs-toggle="dropdown" href="#"><i class="bi bi-palette"></i> Estilos</a>
      <ul class="dropdown-menu dropdown-menu-end">
        {{#estilos}}<li><a class="dropdown-item {{act}}" href="?estilo={{id}}">{{id}} · {{nombre}}</a></li>{{/estilos}}
      </ul>
    </div>
  </div>
</div>
<nav class="navbar navbar-expand-lg sticky-top nav-v">
  <div class="container">
    <a class="navbar-brand d-flex align-items-center gap-2" href="#inicio">
      <img src="{{logo}}" alt="{{nombre_negocio}}" width="40" height="40" class="rounded-circle"><span class="f-title">{{nombre_negocio}}</span>
    </a>
    <button class="navbar-toggler" data-bs-toggle="offcanvas" data-bs-target="#menuOff"><i class="bi bi-list fs-2"></i></button>
    <div class="offcanvas offcanvas-end" id="menuOff">
      <div class="offcanvas-header"><h5>Menú</h5><button class="btn-close" data-bs-dismiss="offcanvas"></button></div>
      <div class="offcanvas-body">
        <ul class="navbar-nav ms-auto gap-lg-3">
          {{#nav}}<li class="nav-item"><a class="nav-link" href="{{url}}" {{#modal}}data-bs-toggle="modal" data-bs-target="{{modal}}"{{/modal}}>{{titulo}}</a></li>{{/nav}}
        </ul>
        <button type="button" class="btn-v ms-lg-4 mt-3 mt-lg-0" data-bs-toggle="modal" data-bs-target="#modalReserva">Reservaciones</button>
      </div>
    </div>
  </div>
</nav>
