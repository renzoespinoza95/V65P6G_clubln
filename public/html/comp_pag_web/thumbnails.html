<section id="menu" class="py-5 sec-tint">
  <div class="container">
    <div class="text-center mb-4">
      <p class="deco mb-1">Nuestro catálogo</p>
      <h2>{{nombre_negocio}} <span class="hl">productos</span> destacados</h2>
      <div class="menu-tabs mt-3">
        <button class="tab active" data-filter="all">Todos</button>
        {{#categorias}}<button class="tab" data-filter="{{id}}">{{name}}</button>{{/categorias}}
      </div>
    </div>
    <div class="row g-4" id="menuGrid">
      {{#productos}}{{> item}}{{/productos}}
    </div>
    <p id="menuVacio" class="text-center d-none">No hay productos en esta categoría.</p>
  </div>
</section>
